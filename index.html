<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PULSE — Social Platform</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* =========================================
       CSS VARIABLES & THEME (Light Default)
       ========================================= */
    :root {
      /* Palette - Light Theme */
      --bg-body: #f0f2f5;
      --bg-card: #ffffff;
      --bg-hover: #f2f2f2;
      --bg-elevated: #ffffff;
      --border: #e4e6eb;
      --border-light: #f0f2f5;

      /* Text */
      --text-main: #050505;
      --text-muted: #65676b;
      --text-light: #b0b3b8;

      /* Brand */
      --primary: #6366f1; /* Indigo */
      --primary-hover: #4f46e5;
      --primary-text: #ffffff;
      
      --accent: #ec4899; /* Pink */

      /* Status */
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;

      /* Dimensions */
      --header-height: 60px;
      --sidebar-width: 275px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;

      /* Transitions */
      --t-fast: 0.2s ease;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
    }

    [data-theme="dark"] {
      --bg-body: #18191a;
      --bg-card: #242526;
      --bg-hover: #3a3b3c;
      --bg-elevated: #242526;
      --border: #3e4042;
      --border-light: #3e4042;
      --text-main: #e4e6eb;
      --text-muted: #b0b3b8;
      --text-light: #65676b;
      --primary: #818cf8;
      --primary-hover: #6366f1;
    }

    /* =========================================
       RESET & BASE
       ========================================= */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      font-size: 15px;
      line-height: 1.5;
      overflow-x: hidden;
      transition: background-color var(--t-fast), color var(--t-fast);
    }
    a { text-decoration: none; color: inherit; cursor: pointer; }
    button { font-family: inherit; border: none; background: none; cursor: pointer; }
    input, textarea { font-family: inherit; }
    ul { list-style: none; }

    /* =========================================
       UTILITIES & COMPONENTS
       ========================================= */
    .hidden { display: none !important; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 8px 16px; border-radius: var(--radius-full); font-weight: 600;
      transition: all var(--t-fast); gap: 8px;
    }
    .btn-sm { padding: 6px 12px; font-size: 0.85rem; }
    .btn-primary { background: var(--primary); color: var(--primary-text); }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-outline { border: 1px solid var(--border); color: var(--text-main); background: transparent; }
    .btn-outline:hover { background: var(--bg-hover); }
    .btn-ghost { color: var(--text-muted); }
    .btn-ghost:hover { background: rgba(0,0,0,0.05); color: var(--text-main); }
    .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--error); }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.2); }
    .btn-icon { padding: 8px; border-radius: 50%; color: var(--text-main); }
    .btn-icon:hover { background: var(--bg-hover); }

    /* Form Elements */
    .form-group { margin-bottom: 1rem; }
    .form-label { display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem; }
    .form-input, .form-textarea {
      width: 100%; padding: 10px 14px; border: 1px solid var(--border);
      border-radius: var(--radius-md); background: var(--bg-card);
      color: var(--text-main); font-size: 0.95rem; transition: border var(--t-fast);
    }
    .form-input:focus, .form-textarea:focus { outline: none; border-color: var(--primary); }
    .form-textarea { resize: vertical; min-height: 80px; }

    /* Avatar */
    .avatar { border-radius: 50%; object-fit: cover; background: #ddd; flex-shrink: 0; }
    .avatar-placeholder {
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; text-transform: uppercase;
    }

    /* Toast Notifications */
    #toast-container {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none;
    }
    .toast {
      background: var(--text-main); color: var(--bg-body);
      padding: 12px 24px; border-radius: var(--radius-full);
      box-shadow: var(--shadow-lg); font-weight: 500; font-size: 0.9rem;
      display: flex; align-items: center; gap: 10px;
      animation: slideUp 0.3s ease; pointer-events: auto;
    }
    .toast.success { background: var(--success); color: white; }
    .toast.error { background: var(--error); color: white; }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); z-index: 5000; display: flex;
      align-items: center; justify-content: center; opacity: 0; pointer-events: none;
      transition: opacity 0.2s; backdrop-filter: blur(4px);
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content {
      background: var(--bg-card); width: 90%; max-width: 500px;
      border-radius: var(--radius-lg); padding: 24px; position: relative;
      box-shadow: var(--shadow-lg); transform: scale(0.95); transition: transform 0.2s;
      max-height: 90vh; overflow-y: auto;
    }
    .modal-overlay.active .modal-content { transform: scale(1); }
    .modal-close { position: absolute; top: 16px; right: 16px; font-size: 24px; color: var(--text-muted); }
    .modal-close:hover { color: var(--text-main); }

    /* =========================================
       AUTH LAYOUT
       ========================================= */
    .auth-page {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
    }
    .auth-card {
      background: var(--bg-card); width: 100%; max-width: 420px;
      padding: 40px; border-radius: 24px; box-shadow: var(--shadow-lg); text-align: center;
    }
    .auth-logo { font-size: 28px; font-weight: 800; color: var(--primary); margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .auth-logo-mark { font-size: 32px; }
    .auth-tabs { display: flex; margin: 24px 0; background: var(--bg-body); padding: 4px; border-radius: 12px; }
    .auth-tab { flex: 1; padding: 8px; border-radius: 8px; font-weight: 600; color: var(--text-muted); transition: all 0.2s; }
    .auth-tab.active { background: var(--bg-card); color: var(--text-main); shadow: var(--shadow-sm); }

    /* =========================================
       MAIN APP LAYOUT
       ========================================= */
    .app-layout { display: flex; min-height: 100vh; }
    
    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width); height: 100vh; position: sticky; top: 0;
      background: var(--bg-card); border-right: 1px solid var(--border);
      padding: 24px 16px; display: flex; flex-direction: column;
      transition: transform 0.3s ease; z-index: 100;
    }
    .nav-item {
      display: flex; align-items: center; gap: 16px; padding: 12px 16px;
      border-radius: var(--radius-full); color: var(--text-muted);
      font-weight: 600; margin-bottom: 4px; transition: all 0.2s;
    }
    .nav-item:hover { background: var(--bg-hover); color: var(--text-main); }
    .nav-item.active { background: var(--primary); color: white; }
    .nav-item.active:hover { background: var(--primary-hover); }
    .sidebar-post-btn {
      margin-top: 16px; background: var(--primary); color: white;
      padding: 14px; border-radius: 24px; font-weight: 700; width: 100%;
      box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3); transition: transform 0.1s;
    }
    .sidebar-post-btn:active { transform: scale(0.98); }

    /* Main Content */
    .main-content { flex: 1; max-width: 680px; margin: 0 auto; border-right: 1px solid var(--border); min-height: 100vh; }
    .content-header { 
      position: sticky; top: 0; background: rgba(255,255,255,0.85); backdrop-filter: blur(12px);
      padding: 16px; border-bottom: 1px solid var(--border); z-index: 50;
      display: flex; justify-content: space-between; align-items: center;
    }
    [data-theme="dark"] .content-header { background: rgba(36, 37, 38, 0.85); }
    
    /* Right Panel */
    .right-panel { width: 350px; padding: 24px; display: none; }
    @media (min-width: 1100px) { .right-panel { display: block; } }

    /* =========================================
       FEED & POSTS
       ========================================= */
    .stories-bar { 
      padding: 16px; display: flex; gap: 16px; overflow-x: auto; 
      scrollbar-width: none; border-bottom: 1px solid var(--border);
    }
    .stories-bar::-webkit-scrollbar { display: none; }
    .story-item { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; min-width: 70px; }
    .story-ring { 
      width: 64px; height: 64px; border-radius: 50%; padding: 3px;
      background: linear-gradient(45deg, var(--primary), var(--accent)); 
    }
    .story-avatar-wrap { width: 100%; height: 100%; background: var(--bg-card); border-radius: 50%; padding: 2px; }
    .story-label { font-size: 0.75rem; color: var(--text-muted); }

    .post-composer-inline { padding: 16px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; }
    .composer-input-wrap { flex: 1; }
    .composer-textarea {
      width: 100%; border: none; background: transparent; resize: none; font-size: 1.1rem;
      padding: 8px 0; outline: none; color: var(--text-main); min-height: 40px;
    }
    .composer-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }

    .post-card { padding: 16px; border-bottom: 1px solid var(--border); transition: background 0.2s; }
    .post-card:hover { background: rgba(0,0,0,0.01); }
    .post-header { display: flex; justify-content: space-between; margin-bottom: 12px; }
    .post-author { display: flex; gap: 12px; align-items: center; }
    .author-meta { display: flex; flex-direction: column; }
    .author-name { font-weight: 700; font-size: 0.95rem; }
    .author-time, .post-handle { font-size: 0.8rem; color: var(--text-muted); }
    .post-content { margin-bottom: 12px; font-size: 1rem; white-space: pre-wrap; }
    .post-actions { display: flex; justify-content: space-between; max-width: 400px; margin-top: 12px; }
    .action-btn { 
      display: flex; align-items: center; gap: 6px; color: var(--text-muted); 
      font-weight: 600; font-size: 0.9rem; transition: color 0.2s;
    }
    .action-btn:hover { color: var(--primary); }
    .action-btn.liked { color: var(--accent); }

    /* Hashtags & Mentions */
    .hashtag { color: var(--primary); font-weight: 600; }
    .mention { color: var(--primary); font-weight: 600; }
    .link { color: var(--primary); text-decoration: underline; }

    /* =========================================
       MESSAGES
       ========================================= */
    .messages-layout { display: flex; height: calc(100vh - 60px); overflow: hidden; }
    .conv-list { width: 320px; border-right: 1px solid var(--border); overflow-y: auto; }
    .conv-item { padding: 16px; display: flex; gap: 12px; cursor: pointer; transition: background 0.2s; border-bottom: 1px solid var(--border-light); }
    .conv-item:hover, .conv-item.active { background: var(--bg-hover); }
    .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-card); }
    .chat-header { padding: 16px; border-bottom: 1px solid var(--border); font-weight: 700; display: flex; align-items: center; gap: 12px; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .message { max-width: 70%; padding: 12px 16px; border-radius: 18px; font-size: 0.95rem; position: relative; }
    .message.mine { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 4px; }
    .message.theirs { align-self: flex-start; background: var(--bg-hover); color: var(--text-main); border-bottom-left-radius: 4px; }
    .chat-input { padding: 16px; border-top: 1px solid var(--border); display: flex; gap: 12px; }

    /* =========================================
       PROFILE
       ========================================= */
    .profile-banner { height: 150px; background: linear-gradient(to right, #6366f1, #ec4899); }
    .profile-header { padding: 0 16px 16px; position: relative; }
    .profile-avatar-lg { 
      width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--bg-card); 
      margin-top: -60px; position: relative; background: var(--bg-card);
    }
    .profile-stats { display: flex; gap: 24px; margin: 12px 0; font-size: 0.95rem; }
    .stat-num { font-weight: 700; color: var(--text-main); }
    .stat-label { color: var(--text-muted); }

    /* =========================================
       RESPONSIVE
       ========================================= */
    .mobile-nav { 
      display: none; position: fixed; bottom: 0; left: 0; width: 100%; height: 60px;
      background: var(--bg-card); border-top: 1px solid var(--border); 
      justify-content: space-around; align-items: center; z-index: 900;
    }
    .mobile-nav-item { color: var(--text-muted); padding: 10px; border-radius: 50%; }
    .mobile-nav-item.active { color: var(--primary); }

    @media (max-width: 1000px) {
      .sidebar { display: none; }
      .mobile-nav { display: flex; }
      .right-panel { display: none; }
      .main-content { max-width: 100%; border: none; }
      .conv-list { width: 100%; display: flex; }
      .messages-layout { flex-direction: column; }
      .chat-area { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000; transform: translateX(100%); transition: transform 0.3s; }
      .chat-area.open { transform: translateX(0); }
    }
  </style>
</head>
<body>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- AUTH VIEW -->
  <div id="view-auth" class="auth-page fade-in">
    <div class="auth-card">
      <div class="auth-logo">
        <span class="auth-logo-mark">◈</span> PULSE
      </div>
      <p style="color:var(--text-muted); margin-bottom: 24px;">Where ideas spark and stories live</p>
      
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="AuthUI.switchTab('login')">Sign In</button>
        <button class="auth-tab" id="tab-register" onclick="AuthUI.switchTab('register')">Create Account</button>
      </div>

      <!-- Login Form -->
      <div id="login-panel">
        <div class="form-group">
          <input type="text" id="login-email" class="form-input" placeholder="Email or Username" autocomplete="username">
        </div>
        <div class="form-group">
          <input type="password" id="login-password" class="form-input" placeholder="Password" autocomplete="current-password">
        </div>
        <div id="login-error" class="toast error hidden" style="position:static; width:100%; margin-bottom:1rem; justify-content:center;"></div>
        <button class="btn btn-primary" style="width:100%" onclick="AuthUI.handleLogin()">Sign In</button>
        <div style="margin-top: 20px; font-size: 0.85rem; color: var(--text-muted);">
          Demo: <strong>alex@pulse.app</strong> / <strong>password123</strong>
        </div>
      </div>

      <!-- Register Form -->
      <div id="register-panel" class="hidden">
        <div class="form-group">
          <input type="text" id="reg-name" class="form-input" placeholder="Full Name">
        </div>
        <div class="form-group">
          <input type="text" id="reg-username" class="form-input" placeholder="Username">
        </div>
        <div class="form-group">
          <input type="email" id="reg-email" class="form-input" placeholder="Email" autocomplete="email">
        </div>
        <div class="form-group">
          <input type="password" id="reg-password" class="form-input" placeholder="Password" autocomplete="new-password">
        </div>
        <div id="reg-error" class="toast error hidden" style="position:static; width:100%; margin-bottom:1rem; justify-content:center;"></div>
        <button class="btn btn-primary" style="width:100%" onclick="AuthUI.handleRegister()">Create Account</button>
      </div>
    </div>
  </div>

  <!-- APP VIEW (Shell) -->
  <div id="view-app" class="app-layout hidden">
    
    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="auth-logo" style="margin-bottom: 32px; padding-left: 12px;">
        <span class="auth-logo-mark">◈</span> PULSE
      </div>
      
      <a onclick="Router.go('feed')" class="nav-item" id="nav-feed">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Home
      </a>
      <a onclick="Router.go('explore')" class="nav-item" id="nav-explore">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Explore
      </a>
      <a onclick="Router.go('notifications')" class="nav-item" id="nav-notifications">
        <div style="position:relative">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          <span id="badge-notifications" style="position:absolute; top:-5px; right:-5px; background:var(--error); width:16px; height:16px; border-radius:50%; font-size:10px; color:white; display:none; align-items:center; justify-content:center;">0</span>
        </div>
        Notifications
      </a>
      <a onclick="Router.go('messages')" class="nav-item" id="nav-messages">
        <div style="position:relative">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
          <span id="badge-messages" style="position:absolute; top:-5px; right:-5px; background:var(--error); width:16px; height:16px; border-radius:50%; font-size:10px; color:white; display:none; align-items:center; justify-content:center;">0</span>
        </div>
        Messages
      </a>
      <a onclick="Router.go('profile')" class="nav-item" id="nav-profile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Profile
      </a>
      <a onclick="Router.go('settings')" class="nav-item" id="nav-settings">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        Settings
      </a>

      <button class="sidebar-post-btn" onclick="App.openPostComposer()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Post
      </button>

      <div style="margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border);">
        <div class="nav-item" style="cursor: default; padding-left: 8px;">
          <div id="current-user-avatar"></div>
          <div style="display:flex; flex-direction:column; overflow:hidden;">
            <span id="current-user-name" style="font-size:0.9rem;">User</span>
            <span id="current-user-handle" style="font-size:0.8rem;">@handle</span>
          </div>
          <button onclick="Auth.logout()" style="margin-left:auto; color:var(--text-muted);" title="Sign out">
             <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </div>
    </nav>

    <!-- Main Content Area -->
    <main class="main-content" id="main-container">
      <!-- Dynamic Content Injected Here -->
    </main>

    <!-- Right Panel -->
    <aside class="right-panel">
      <div style="margin-bottom: 24px;">
        <h3 style="font-size: 1.1rem; font-weight: 800; margin-bottom: 16px;">Who to follow</h3>
        <div id="suggested-users"></div>
      </div>
      <div>
        <h3 style="font-size: 1.1rem; font-weight: 800; margin-bottom: 16px;">Trending</h3>
        <div id="trending-topics"></div>
      </div>
    </aside>

    <!-- Mobile Nav -->
    <nav class="mobile-nav">
      <a onclick="Router.go('feed')" class="mobile-nav-item" id="mob-feed">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
      </a>
      <a onclick="Router.go('explore')" class="mobile-nav-item" id="mob-explore">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </a>
      <a onclick="App.openPostComposer()" class="mobile-nav-item" style="color:var(--primary)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </a>
      <a onclick="Router.go('notifications')" class="mobile-nav-item" id="mob-notifications">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
      </a>
      <a onclick="Router.go('profile')" class="mobile-nav-item" id="mob-profile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </a>
    </nav>
  </div>

  <!-- Modal Overlay -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-content" id="modal-content"></div>
  </div>

  <script>
    /* =========================================
       SEED DATA
       ========================================= */
    const SEED_DATA = {
      users: [
        { id: "uid_001", username: "alex_volkov", email: "alex@pulse.app", password: "5f4dcc3b5aa765d61d8327deb882cf99", displayName: "Alex Volkov", bio: "Full-stack dev. Building things that matter. ✦", avatar: null, avatarColor: "#6366f1", followers: ["uid_002", "uid_003"], following: ["uid_002"], bookmarks: [], theme: "light", verified: true, createdAt: "2024-01-10T08:00:00Z" },
        { id: "uid_002", username: "maya_chen", email: "maya@pulse.app", password: "5f4dcc3b5aa765d61d8327deb882cf99", displayName: "Maya Chen", bio: "Photographer & visual artist. Light is my medium. 📸", avatar: null, avatarColor: "#ec4899", followers: ["uid_001"], following: ["uid_001"], bookmarks: [], theme: "light", verified: true, createdAt: "2024-01-12T09:30:00Z" },
        { id: "uid_003", username: "ryan_okafor", email: "ryan@pulse.app", password: "5f4dcc3b5aa765d61d8327deb882cf99", displayName: "Ryan Okafor", bio: "Movement coach. Helping people find their edge 💪", avatar: null, avatarColor: "#f59e0b", followers: ["uid_001"], following: ["uid_001"], bookmarks: [], theme: "light", verified: false, createdAt: "2024-01-18T11:00:00Z" }
      ],
      posts: [
        { id: "pid_001", authorId: "uid_001", content: "Just shipped a new feature for our design system — zero-dependency, pure CSS container queries. The web platform has genuinely leveled up. No more hacks. 🚀\n\n#webdev #css #frontend", images: [], likes: ["uid_002", "uid_003"], comments: [], hashtags: ["webdev", "css", "frontend"], shares: 12, createdAt: new Date().toISOString() },
        { id: "pid_002", authorId: "uid_002", content: "Golden hour at the Brooklyn Bridge. Shot this on film — the grain adds something digital just can't replicate. Some moments deserve patience. 📷\n\n#photography #film #nyc", images: [], likes: ["uid_001"], comments: [], hashtags: ["photography", "film", "nyc"], shares: 28, createdAt: new Date(Date.now() - 3600000).toISOString() },
        { id: "pid_003", authorId: "uid_003", content: "Week 12 of training complete. The discipline you build in the gym translates to every area of life. Consistency > intensity. Every. Single. Time. 💪\n\n#fitness #mindset", images: [], likes: [], comments: [], hashtags: ["fitness", "mindset"], shares: 5, createdAt: new Date(Date.now() - 7200000).toISOString() }
      ],
      conversations: [],
      notifications: []
    };

    /* =========================================
       UTILS
       ========================================= */
    const Utils = {
      generateId: (p) => `${p}_${Date.now().toString(36)}_${Math.random().toString(36).substr(2, 5)}`,
      hashPassword: (p) => { /* Simple hash for demo */ let h=5381; for(let i=0;i<p.length;i++) h=(h<<5)+h+p.charCodeAt(i); return h>>>0; },
      timeAgo: (d) => {
        const s = Math.floor((new Date() - new Date(d)) / 1000);
        if(s < 60) return 'just now';
        if(s < 3600) return Math.floor(s/60) + 'm';
        if(s < 86400) return Math.floor(s/3600) + 'h';
        return Math.floor(s/86400) + 'd';
      },
      sanitize: (str) => {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML.replace(/#([\w]+)/g, '<a href="#" onclick="Router.go(\'explore\', \'tag\', \'$1\')" class="hashtag">#$1</a>')
                          .replace(/@([\w]+)/g, '<a href="#" onclick="Router.go(\'profile\', \'u\', \'$1\')" class="mention">@$1</a>')
                          .replace(/\n/g, '<br>');
      },
      getInitials: (n) => n.split(' ').map(w=>w[0]).join('').substr(0,2).toUpperCase(),
      avatarHTML: (u, s=40) => {
        if(u.avatar) return `<img src="${u.avatar}" class="avatar" style="width:${s}px;height:${s}px;">`;
        return `<div class="avatar-placeholder" style="width:${s}px;height:${s}px;background:${u.avatarColor};font-size:${s*0.4}px;">${Utils.getInitials(u.displayName)}</div>`;
      },
      showToast: (m, t='info') => {
        const c = document.getElementById('toast-container');
        const el = document.createElement('div');
        el.className = `toast ${t}`;
        el.innerHTML = `<span>${t==='success'?'✓':t==='error'?'✕':'ℹ'}</span> ${m}`;
        c.appendChild(el);
        setTimeout(() => { el.style.opacity='0'; el.style.transform='translateY(20px)'; setTimeout(()=>el.remove(),300); }, 3000);
      },
      modal: (html) => {
        const ov = document.getElementById('modal-overlay');
        const ct = document.getElementById('modal-content');
        ct.innerHTML = html;
        ov.classList.add('active');
        ov.onclick = (e) => { if(e.target===ov) Utils.closeModal(); };
      },
      closeModal: () => { document.getElementById('modal-overlay').classList.remove('active'); }
    };

    /* =========================================
       DATABASE (LocalStorage)
       ========================================= */
    const DB = {
      init: () => {
        if(!localStorage.getItem('pulse_init')) {
          localStorage.setItem('pulse_users', JSON.stringify(SEED_DATA.users));
          localStorage.setItem('pulse_posts', JSON.stringify(SEED_DATA.posts));
          localStorage.setItem('pulse_convos', JSON.stringify(SEED_DATA.conversations));
          localStorage.setItem('pulse_notifs', JSON.stringify(SEED_DATA.notifications));
          localStorage.setItem('pulse_init', 'true');
        }
      },
      get: (k) => JSON.parse(localStorage.getItem(k) || '[]'),
      set: (k, v) => localStorage.setItem(k, JSON.stringify(v)),
      users: {
        getAll: () => DB.get('pulse_users'),
        getById: (id) => DB.get('pulse_users').find(u => u.id === id),
        getByEmail: (e) => DB.get('pulse_users').find(u => u.email === e),
        create: (data) => {
          const us = DB.get('pulse_users');
          const nu = { id: Utils.generateId('u'), followers:[], following:[], bookmarks:[], theme:'light', verified:false, createdAt:new Date().toISOString(), ...data };
          us.push(nu);
          DB.set('pulse_users', us);
          return nu;
        },
        update: (id, d) => {
          const us = DB.get('pulse_users');
          const idx = us.findIndex(u => u.id === id);
          if(idx>-1) { us[idx] = { ...us[idx], ...d }; DB.set('pulse_users', us); return us[idx]; }
        },
        follow: (fid, tid) => {
          const us = DB.get('pulse_users');
          const f = us.find(u=>u.id===fid), t = us.find(u=>u.id===tid);
          if(f && t && !f.following.includes(tid)) {
            f.following.push(tid); t.followers.push(fid);
            DB.set('pulse_users', us);
            // Notify
            const ns = DB.get('pulse_notifs');
            ns.unshift({ id: Utils.generateId('n'), userId: tid, fromUserId: fid, type: 'follow', read: false, createdAt: new Date().toISOString() });
            DB.set('pulse_notifs', ns);
            App.updateBadges();
          }
        },
        isFollowing: (fid, tid) => DB.users.getById(fid).following.includes(tid)
      },
      posts: {
        getAll: () => DB.get('pulse_posts'),
        create: (aid, data) => {
          const ps = DB.get('pulse_posts');
          const tags = (data.content.match(/#[\w]+/g) || []).map(t=>t.substr(1));
          const p = { id: Utils.generateId('p'), authorId: aid, likes:[], comments:[], shares:0, hashtags:tags, createdAt: new Date().toISOString(), ...data };
          ps.unshift(p);
          DB.set('pulse_posts', ps);
          return p;
        },
        like: (pid, uid) => {
          const ps = DB.get('pulse_posts');
          const p = ps.find(x=>x.id===pid);
          if(p) {
            if(p.likes.includes(uid)) p.likes = p.likes.filter(x=>x!==uid);
            else p.likes.push(uid);
            DB.set('pulse_posts', ps);
            
            // Notify if liking other's post
            if(p.likes.includes(uid) && p.authorId !== uid) {
               const ns = DB.get('pulse_notifs');
               ns.unshift({ id: Utils.generateId('n'), userId: p.authorId, fromUserId: uid, type:'like', postId: pid, read:false, createdAt: new Date().toISOString() });
               DB.set('pulse_notifs', ns);
               App.updateBadges();
            }
            return p;
          }
        },
        comment: (pid, uid, txt) => {
           const ps = DB.get('pulse_posts');
           const p = ps.find(x=>x.id===pid);
           if(p) {
             p.comments.push({ id: Utils.generateId('c'), authorId: uid, content: txt, createdAt: new Date().toISOString() });
             DB.set('pulse_posts', ps);
             return p;
           }
        }
      },
      session: {
        get: () => JSON.parse(localStorage.getItem('pulse_session')),
        set: (u) => localStorage.setItem('pulse_session', JSON.stringify(u)),
        clear: () => localStorage.removeItem('pulse_session')
      }
    };

    /* =========================================
       AUTH
       ========================================= */
    const Auth = {
      guard: () => {
        const s = DB.session.get();
        if(!s) { Router.go('auth'); return null; }
        return DB.users.getById(s.userId);
      },
      login: (e, p) => {
        const u = DB.users.getByEmail(e) || DB.users.getAll().find(u=>u.username === e);
        if(!u || (u.password !== Utils.hashPassword(p) && u.password !== p)) return { ok: false, error: 'Invalid credentials' };
        DB.session.set({ userId: u.id });
        return { ok: true, user: u };
      },
      register: (d) => {
        if(DB.users.getByEmail(d.email)) return { ok: false, error: 'Email taken' };
        const u = DB.users.create(d);
        DB.session.set({ userId: u.id });
        return { ok: true, user: u };
      },
      logout: () => {
        DB.session.clear();
        window.location.reload();
      }
    };

    /* =========================================
       ROUTER & APP CONTROLLER
       ========================================= */
    const Router = {
      current: 'auth',
      go: (view, key, val) => {
        // Hide all main sections
        document.getElementById('view-auth').classList.add('hidden');
        document.getElementById('view-app').classList.add('hidden');
        
        // Clear nav active states
        document.querySelectorAll('.nav-item, .mobile-nav-item').forEach(el => el.classList.remove('active'));
        const navId = `nav-${view}`;
        const mobId = `mob-${view}`;
        if(document.getElementById(navId)) document.getElementById(navId).classList.add('active');
        if(document.getElementById(mobId)) document.getElementById(mobId).classList.add('active');

        if (view === 'auth') {
          document.getElementById('view-auth').classList.remove('hidden');
        } else {
          const user = Auth.guard();
          if (!user) return; // Guard redirects to auth
          
          document.getElementById('view-app').classList.remove('hidden');
          App.renderSidebarUser(user);
          
          const container = document.getElementById('main-container');
          container.innerHTML = ''; // Clear

          if (view === 'feed') FeedView.render(container, user);
          else if (view === 'explore') ExploreView.render(container, user);
          else if (view === 'notifications') NotificationsView.render(container, user);
          else if (view === 'messages') MessagesView.render(container, user);
          else if (view === 'profile') ProfileView.render(container, user, key && val ? val : user.username);
          else if (view === 'settings') SettingsView.render(container, user);
        }
        Router.current = view;
        window.scrollTo(0,0);
      }
    };

    const App = {
      init: () => {
        DB.init();
        const u = DB.session.get() ? DB.users.getById(DB.session.get().userId) : null;
        if(u) {
          // Apply Theme
          document.documentElement.setAttribute('data-theme', u.theme || 'light');
          Router.go('feed');
          App.renderRightPanel(u);
          App.updateBadges();
        } else {
          Router.go('auth');
        }
      },
      renderSidebarUser: (u) => {
        document.getElementById('current-user-avatar').innerHTML = Utils.avatarHTML(u, 40);
        document.getElementById('current-user-name').textContent = u.displayName;
        document.getElementById('current-user-handle').textContent = '@' + u.username;
      },
      updateBadges: () => {
        const u = DB.users.getById(DB.session.get().userId);
        const notifs = DB.get('pulse_notifs').filter(n => n.userId === u.id && !n.read).length;
        const msgs = DB.get('pulse_convos').filter(c => c.participants.includes(u.id)).length; // Simplified for demo
        
        const bN = document.getElementById('badge-notifications');
        const bM = document.getElementById('badge-messages');
        
        if(bN) { bN.textContent = notifs; bN.style.display = notifs ? 'flex' : 'none'; }
        // Simplified message badge logic for demo
      },
      renderRightPanel: (u) => {
        const sugg = DB.users.getAll().filter(x => x.id !== u.id).slice(0,3);
        const posts = DB.posts.getAll();
        const counts = {};
        posts.forEach(p => p.hashtags.forEach(h => counts[h] = (counts[h]||0)+1));
        const trends = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,3);

        document.getElementById('suggested-users').innerHTML = sugg.map(s => `
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
            ${Utils.avatarHTML(s, 40)}
            <div style="flex:1">
              <div style="font-weight:600;font-size:0.9rem;">${s.displayName}</div>
              <div style="font-size:0.8rem;color:var(--text-muted);">@${s.username}</div>
            </div>
            <button class="btn btn-sm btn-outline" onclick="App.follow('${s.id}')">Follow</button>
          </div>
        `).join('');

        document.getElementById('trending-topics').innerHTML = trends.map(t => `
          <div style="padding:8px 0; border-bottom:1px solid var(--border-light); cursor:pointer;" onclick="Router.go('explore', 'tag', '${t[0]}')">
            <div style="font-weight:600;font-size:0.9rem;color:var(--text-main);">#${t[0]}</div>
            <div style="font-size:0.8rem;color:var(--text-muted);">${t[1]} posts</div>
          </div>
        `).join('');
      },
      follow: (tid) => {
        const uid = DB.session.get().userId;
        DB.users.follow(uid, tid);
        Utils.showToast('Followed!', 'success');
        App.renderRightPanel(DB.users.getById(uid)); // Refresh
      },
      toggleTheme: () => {
        const u = DB.users.getById(DB.session.get().userId);
        const newT = u.theme === 'light' ? 'dark' : 'light';
        DB.users.update(u.id, { theme: newT });
        document.documentElement.setAttribute('data-theme', newT);
        Utils.showToast(`Switched to ${newT} mode`);
      },
      openPostComposer: () => {
        const u = DB.users.getById(DB.session.get().userId);
        Utils.modal(`
          <h3 style="margin-bottom:16px;">Create Post</h3>
          <div style="display:flex;gap:12px;">
            ${Utils.avatarHTML(u, 48)}
            <textarea id="composer-txt" class="form-textarea" style="flex:1;height:120px;" placeholder="What's on your mind?"></textarea>
          </div>
          <div style="margin-top:16px;text-align:right;">
            <button class="btn btn-primary" onclick="App.submitPost()">Post</button>
          </div>
        `);
        setTimeout(()=>document.getElementById('composer-txt').focus(), 100);
      },
      submitPost: () => {
        const txt = document.getElementById('composer-txt').value;
        if(!txt.trim()) return;
        const u = DB.users.getById(DB.session.get().userId);
        DB.posts.create(u.id, { content: txt });
        Utils.closeModal();
        Utils.showToast('Posted!', 'success');
        if(Router.current === 'feed') FeedView.render(document.getElementById('main-container'), u);
        if(Router.current === 'profile') ProfileView.render(document.getElementById('main-container'), u, u.username);
      }
    };

    /* =========================================
       VIEW: FEED
       ========================================= */
    const FeedView = {
      render: (c, u) => {
        const posts = DB.posts.getAll();
        
        // Stories
        const storiesHTML = `
          <div class="stories-bar">
            <div class="story-item">
              <div class="story-ring"><div class="story-avatar-wrap">${Utils.avatarHTML(u, 56)}</div></div>
              <span class="story-label">Your Story</span>
            </div>
            ${u.following.map(fid => {
              const fu = DB.users.getById(fid);
              return `
                <div class="story-item">
                  <div class="story-ring"><div class="story-avatar-wrap">${Utils.avatarHTML(fu, 56)}</div></div>
                  <span class="story-label">${fu.displayName.split(' ')[0]}</span>
                </div>`;
            }).join('')}
          </div>
        `;

        // Composer
        const composerHTML = `
          <div class="post-composer-inline">
            ${Utils.avatarHTML(u, 40)}
            <div class="composer-input-wrap">
              <textarea class="composer-textarea" placeholder="What's happening?" onclick="App.openPostComposer()" readonly></textarea>
            </div>
          </div>
        `;

        // Posts
        const postsHTML = posts.map(p => {
          const author = DB.users.getById(p.authorId);
          const liked = p.likes.includes(u.id);
          return `
            <article class="post-card fade-in">
              <div class="post-header">
                <div class="post-author">
                  ${Utils.avatarHTML(author, 44)}
                  <div class="author-meta">
                    <span class="author-name">${author.displayName} ${author.verified?'✓':''}</span>
                    <span class="post-handle">@${author.username} · ${Utils.timeAgo(p.createdAt)}</span>
                  </div>
                </div>
                <button class="btn-icon">•••</button>
              </div>
              <div class="post-content">${Utils.sanitize(p.content)}</div>
              <div class="post-actions">
                <button class="action-btn ${liked?'liked':''}" onclick="FeedView.like('${p.id}')">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="${liked?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
                  ${p.likes.length}
                </button>
                <button class="action-btn">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                  ${p.comments.length}
                </button>
                <button class="action-btn">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
                </button>
              </div>
            </article>
          `;
        }).join('');

        c.innerHTML = `
          <div class="content-header"><h2>Home</h2></div>
          ${storiesHTML}
          ${composerHTML}
          <div>${postsHTML}</div>
        `;
      },
      like: (pid) => {
        const uid = DB.session.get().userId;
        DB.posts.like(pid, uid);
        FeedView.render(document.getElementById('main-container'), DB.users.getById(uid));
      }
    };

    /* =========================================
       VIEW: EXPLORE
       ========================================= */
    const ExploreView = {
      render: (c, u) => {
        const posts = DB.posts.getAll();
        c.innerHTML = `
          <div class="content-header">
             <input type="text" class="form-input" placeholder="Search PULSE" style="border-radius:99px; background:var(--bg-hover); border:none;">
          </div>
          <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap:4px; padding-top:16px;">
            ${posts.map(p => `
              <div style="aspect-ratio:1; background:var(--bg-hover); padding:16px; cursor:pointer;" onclick="alert('Open post ${p.id}')">
                <div style="font-size:0.8rem; color:var(--text-muted); margin-bottom:8px;">@${DB.users.getById(p.authorId).username}</div>
                <div style="font-size:0.9rem; overflow:hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;">${p.content}</div>
              </div>
            `).join('')}
          </div>
        `;
      }
    };

    /* =========================================
       VIEW: NOTIFICATIONS
       ========================================= */
    const NotificationsView = {
      render: (c, u) => {
        const notifs = DB.get('pulse_notifs').filter(n => n.userId === u.id);
        c.innerHTML = `
          <div class="content-header"><h2>Notifications</h2></div>
          <div>
            ${notifs.length ? notifs.map(n => {
              const from = DB.users.getById(n.fromUserId);
              let txt = '';
              if(n.type === 'follow') txt = 'followed you.';
              if(n.type === 'like') txt = 'liked your post.';
              return `
                <div style="display:flex;gap:12px; padding:16px; border-bottom:1px solid var(--border-light); align-items:center;">
                  ${Utils.avatarHTML(from, 48)}
                  <div>
                    <div><strong>${from.displayName}</strong> ${txt}</div>
                    <div style="font-size:0.8rem; color:var(--text-muted);">${Utils.timeAgo(n.createdAt)}</div>
                  </div>
                </div>
              `;
            }).join('') : '<div style="padding:20px; text-align:center; color:var(--text-muted);">No notifications yet</div>'}
          </div>
        `;
        // Mark all read
        const all = DB.get('pulse_notifs');
        all.forEach(n => { if(n.userId === u.id) n.read = true; });
        DB.set('pulse_notifs', all);
        App.updateBadges();
      }
    };

    /* =========================================
       VIEW: MESSAGES
       ========================================= */
    const MessagesView = {
      render: (c, u) => {
        const convos = DB.get('pulse_convos').filter(x => x.participants.includes(u.id));
        // Mock a list of users to chat with if no convos
        const users = DB.users.getAll().filter(x => x.id !== u.id);
        
        c.innerHTML = `
           <div class="messages-layout">
             <div class="conv-list">
               <div style="padding:16px; border-bottom:1px solid var(--border-light); font-weight:700;">Messages</div>
               ${users.map(user => `
                 <div class="conv-item" onclick="MessagesView.openChat('${user.id}')">
                   ${Utils.avatarHTML(user, 48)}
                   <div style="flex:1; overflow:hidden;">
                     <div style="font-weight:600;">${user.displayName}</div>
                     <div style="font-size:0.85rem; color:var(--text-muted);">@${user.username}</div>
                   </div>
                 </div>
               `).join('')}
             </div>
             <div class="chat-area" id="active-chat">
                <div style="height:100%; display:flex; align-items:center; justify-content:center; color:var(--text-muted);">
                  Select a conversation
                </div>
             </div>
           </div>
        `;
      },
      openChat: (tid) => {
        const uid = DB.session.get().userId;
        const target = DB.users.getById(tid);
        // Find or create convo
        let conv = DB.get('pulse_convos').find(c => c.participants.includes(uid) && c.participants.includes(tid));
        if(!conv) {
          conv = { id: Utils.generateId('c'), participants: [uid, tid], messages: [] };
          const list = DB.get('pulse_convos');
          list.push(conv);
          DB.set('pulse_convos', list);
        }

        const chatEl = document.getElementById('active-chat');
        chatEl.classList.add('open');
        chatEl.innerHTML = `
          <div class="chat-header">
             <button class="btn-icon" onclick="document.getElementById('active-chat').classList.remove('open')">←</button>
             ${Utils.avatarHTML(target, 36)} ${target.displayName}
          </div>
          <div class="chat-messages" id="chat-msgs">
             ${conv.messages.map(m => `
               <div class="message ${m.senderId===uid?'mine':'theirs'}">
                 ${m.content}
               </div>
             `).join('')}
          </div>
          <div class="chat-input">
             <input type="text" id="msg-input" class="form-input" placeholder="Type a message...">
             <button class="btn btn-primary" onclick="MessagesView.send('${conv.id}')">Send</button>
          </div>
        `;
        // Auto scroll
        const box = document.getElementById('chat-msgs');
        box.scrollTop = box.scrollHeight;
      },
      send: (cid) => {
        const inp = document.getElementById('msg-input');
        const txt = inp.value.trim();
        if(!txt) return;
        const uid = DB.session.get().userId;
        const list = DB.get('pulse_convos');
        const c = list.find(x => x.id === cid);
        c.messages.push({ id: Utils.generateId('m'), senderId: uid, content: txt, createdAt: new Date().toISOString() });
        DB.set('pulse_convos', list);
        
        // Re-render chat (simple way)
        // In real app, just append node
        const box = document.getElementById('chat-msgs');
        const div = document.createElement('div');
        div.className = 'message mine fade-in';
        div.textContent = txt;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        inp.value = '';
      }
    };

    /* =========================================
       VIEW: PROFILE
       ========================================= */
    const ProfileView = {
      render: (c, u, username) => {
        const user = DB.users.getAll().find(x => x.username === username) || u;
        const isMe = user.id === u.id;
        const posts = DB.posts.getAll().filter(p => p.authorId === user.id);
        
        c.innerHTML = `
          <div class="profile-banner"></div>
          <div class="profile-header">
            <div class="profile-avatar-lg">${Utils.avatarHTML(user, 120)}</div>
            <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-top:12px;">
              <div>
                <h2 style="font-size:1.5rem; font-weight:800;">${user.displayName} ${user.verified?'✓':''}</h2>
                <div style="color:var(--text-muted);">@${user.username}</div>
              </div>
              ${!isMe ? `<button class="btn btn-primary" onclick="App.follow('${user.id}')">${DB.users.isFollowing(u.id, user.id)?'Following':'Follow'}</button>` : `<button class="btn btn-outline" onclick="App.toggleTheme()">Toggle Theme</button>`}
            </div>
            <div style="margin-top:16px;">${user.bio || ''}</div>
            <div class="profile-stats">
              <div><span class="stat-num">${user.following.length}</span> <span class="stat-label">Following</span></div>
              <div><span class="stat-num">${user.followers.length}</span> <span class="stat-label">Followers</span></div>
            </div>
          </div>
          <div style="border-top:1px solid var(--border);">
             <div style="padding:16px; font-weight:700; border-bottom:1px solid var(--border);">Posts</div>
             ${posts.map(p => `
                <div style="padding:16px; border-bottom:1px solid var(--border-light);">
                   <div style="font-size:0.9rem; margin-bottom:8px;">${Utils.timeAgo(p.createdAt)}</div>
                   <div>${Utils.sanitize(p.content)}</div>
                   <div style="margin-top:8px; display:flex; gap:16px; color:var(--text-muted); font-size:0.9rem;">
                     <span>${p.likes.length} Likes</span>
                     <span>${p.comments.length} Comments</span>
                   </div>
                </div>
             `).join('')}
          </div>
        `;
      }
    };

    /* =========================================
       VIEW: SETTINGS
       ========================================= */
    const SettingsView = {
      render: (c, u) => {
        c.innerHTML = `
          <div class="content-header"><h2>Settings</h2></div>
          <div style="padding:16px;">
            <div style="margin-bottom:24px;">
              <h3 style="margin-bottom:12px;">Appearance</h3>
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span>Dark Mode</span>
                <button class="btn btn-outline" onclick="App.toggleTheme()">Toggle</button>
              </div>
            </div>
            <div>
              <h3 style="margin-bottom:12px;">Account</h3>
              <button class="btn btn-danger" onclick="Auth.logout()">Log Out</button>
            </div>
          </div>
        `;
      }
    };

    /* =========================================
       AUTH UI
       ========================================= */
    const AuthUI = {
      switchTab: (t) => {
        document.getElementById('tab-login').classList.toggle('active', t==='login');
        document.getElementById('tab-register').classList.toggle('active', t==='register');
        document.getElementById('login-panel').classList.toggle('hidden', t!=='login');
        document.getElementById('register-panel').classList.toggle('hidden', t!=='register');
      },
      handleLogin: () => {
        const e = document.getElementById('login-email').value;
        const p = document.getElementById('login-password').value;
        const err = document.getElementById('login-error');
        const res = Auth.login(e, p);
        if(res.ok) Router.go('feed');
        else { err.textContent = res.error; err.classList.remove('hidden'); }
      },
      handleRegister: () => {
        const n = document.getElementById('reg-name').value;
        const u = document.getElementById('reg-username').value;
        const em = document.getElementById('reg-email').value;
        const p = document.getElementById('reg-password').value;
        const err = document.getElementById('reg-error');
        if(!n || !u || !em || !p) return err.classList.remove('hidden');
        const res = Auth.register({ displayName:n, username:u, email:em, password:p });
        if(res.ok) Router.go('feed');
        else { err.textContent = res.error; err.classList.remove('hidden'); }
      }
    };

    // Initialize App
    App.init();

  </script>
</body>
</html>
