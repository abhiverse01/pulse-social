<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PULSE ◈ — Godmode</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       GODMODE CSS SYSTEM
       ============================================================ */
    
    /* --- VARIABLES --- */
    :root {
      /* Palette: Midnight & Neon */
      --bg-deep:      #050508;
      --bg-surface:   #0f0f16;
      --bg-glass:     rgba(20, 20, 30, 0.7);
      --bg-glass-heavy: rgba(10, 10, 18, 0.85);
      --bg-hover:     rgba(255, 255, 255, 0.05);
      --bg-active:    rgba(255, 255, 255, 0.1);
      
      --accent:       #8b5cf6;       /* Violet */
      --accent-glow:  rgba(139, 92, 246, 0.5);
      --accent-gradient: linear-gradient(135deg, #8b5cf6, #d946ef);
      
      --success:      #10b981;
      --warning:      #f59e0b;
      --error:        #ef4444;
      --info:         #3b82f6;

      --text-main:    #ffffff;
      --text-sec:     #94a3b8;
      --text-mute:    #475569;
      
      --border:       rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.15);
      --border-glow:  rgba(139, 92, 246, 0.3);

      --font-main: 'Plus Jakarta Sans', -apple-system, sans-serif;
      
      --sidebar-w:   280px;
      --rightbar-w:  320px;
      --content-max: 680px;

      --radius-sm:  8px;
      --radius-md:  12px;
      --radius-lg:  16px;
      --radius-xl:  24px;
      --radius-full: 9999px;

      --shadow-sm:  0 2px 8px rgba(0,0,0,0.2);
      --shadow-lg:  0 10px 40px -10px rgba(0,0,0,0.5);
      --shadow-glow: 0 0 20px var(--accent-glow);

      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="light"] {
      --bg-deep:      #f8fafc;
      --bg-surface:   #ffffff;
      --bg-glass:     rgba(255, 255, 255, 0.8);
      --bg-glass-heavy: rgba(255, 255, 255, 0.95);
      --bg-hover:     rgba(0, 0, 0, 0.04);
      --bg-active:    rgba(0, 0, 0, 0.08);
      --text-main:    #0f172a;
      --text-sec:     #475569;
      --text-mute:    #94a3b8;
      --border:       rgba(0, 0, 0, 0.08);
      --border-strong: rgba(0, 0, 0, 0.12);
      --shadow-sm:  0 2px 10px rgba(0,0,0,0.05);
      --shadow-lg:  0 10px 30px -5px rgba(0,0,0,0.1);
    }

    /* --- RESET & BASE --- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      font-family: var(--font-main);
      background-color: var(--bg-deep);
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.08), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(217, 70, 239, 0.08), transparent 25%);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.3s ease;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-sec); }

    a { color: inherit; text-decoration: none; cursor: pointer; }
    button { cursor: pointer; border: none; background: none; font-family: inherit; }
    
    /* Typography */
    h1, h2, h3, h4 { font-weight: 700; letter-spacing: -0.02em; }
    p { color: var(--text-sec); }
    .text-gradient {
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* --- UTILITIES --- */
    .glass { background: var(--bg-glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); }
    .glass-panel { background: var(--bg-glass); border: 1px solid var(--border); backdrop-filter: blur(12px); border-radius: var(--radius-xl); }
    .flex-center { display: flex; align-items: center; justify-content: center; }
    .hidden { display: none !important; }
    .fade-enter { animation: fadeIn 0.3s var(--ease-smooth) forwards; }
    .slide-up { animation: slideUp 0.4s var(--ease-spring) forwards; }
    
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    /* --- COMPONENTS --- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      padding: 0.6rem 1.25rem; border-radius: var(--radius-full); font-weight: 600;
      font-size: 0.9rem; transition: all 0.2s var(--ease-smooth); position: relative; overflow: hidden;
    }
    .btn-primary { background: var(--accent-gradient); color: #fff; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3); }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4); }
    .btn-primary:active { transform: translateY(0); }
    
    .btn-ghost { color: var(--text-sec); background: transparent; }
    .btn-ghost:hover { color: var(--text-main); background: var(--bg-hover); }
    
    .btn-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text-sec); transition: 0.2s; }
    .btn-icon:hover { background: var(--bg-hover); color: var(--accent); transform: scale(1.05); }

    .input-field {
      width: 100%; background: var(--bg-deep); border: 1px solid var(--border);
      color: var(--text-main); padding: 0.75rem 1rem; border-radius: var(--radius-md);
      font-family: inherit; transition: 0.2s;
    }
    .input-field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15); }

    .avatar { border-radius: 50%; object-fit: cover; background: var(--bg-surface); border: 1px solid var(--border); flex-shrink: 0; }
    .story-ring {
      padding: 2.5px; border-radius: 50%;
      background: var(--border); position: relative;
    }
    .story-ring.has-story {
      background: var(--accent-gradient);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* --- LAYOUT --- */
    #app { display: flex; min-height: 100vh; max-width: 1440px; margin: 0 auto; position: relative; }
    
    /* Sidebar */
    aside.sidebar {
      width: var(--sidebar-w); height: 100vh; position: fixed; top: 0; left: 0;
      padding: 1.5rem 1rem; display: flex; flex-direction: column; border-right: 1px solid var(--border);
      background: var(--bg-glass-heavy); backdrop-filter: blur(20px); z-index: 50;
    }
    .logo { font-size: 1.5rem; font-weight: 800; padding: 0 0.75rem 2rem; display: flex; align-items: center; gap: 0.5rem; letter-spacing: -1px; }
    .logo svg { color: var(--accent); filter: drop-shadow(0 0 8px var(--accent-glow)); }
    
    .nav-item {
      display: flex; align-items: center; gap: 1rem; padding: 0.8rem 1rem;
      border-radius: var(--radius-xl); color: var(--text-sec); font-weight: 600; font-size: 1rem;
      transition: 0.2s; margin-bottom: 0.25rem;
    }
    .nav-item:hover { background: var(--bg-hover); color: var(--text-main); }
    .nav-item.active { background: var(--accent-gradient); color: #fff; box-shadow: var(--shadow-glow); }
    .nav-item svg { width: 22px; height: 22px; stroke-width: 2; }
    
    /* Main Content */
    main.main-content {
      margin-left: var(--sidebar-w); flex: 1; display: flex; justify-content: center;
      min-height: 100vh; border-right: 1px solid var(--border); background: transparent;
    }
    .page-container { width: 100%; max-width: var(--content-max); min-width: 0; position: relative; }

    /* Right Panel */
    aside.right-panel {
      width: var(--rightbar-w); position: fixed; right: 0; top: 0; height: 100vh;
      padding: 1.5rem; overflow-y: auto; border-left: 1px solid var(--border);
      background: rgba(0,0,0,0.2); backdrop-filter: blur(10px); z-index: 40;
    }

    /* --- PAGE VIEWS --- */
    .view-section { display: none; animation: fadeIn 0.3s ease; }
    .view-section.active { display: block; }

    /* Auth */
    .auth-container {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at center, rgba(139,92,246,0.15) 0%, transparent 70%);
    }
    .auth-card {
      width: 100%; max-width: 420px; padding: 2.5rem; background: var(--bg-glass);
      border: 1px solid var(--border-strong); border-radius: var(--radius-2xl);
      box-shadow: var(--shadow-lg); backdrop-filter: blur(30px);
      animation: slideUp 0.5s var(--ease-spring);
    }
    
    /* Feed & Posts */
    .feed-header { position: sticky; top: 0; z-index: 30; background: rgba(5, 5, 8, 0.8); backdrop-filter: blur(12px); padding: 1rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .stories-tray { display: flex; gap: 1rem; padding: 1rem; overflow-x: auto; scrollbar-width: none; margin-bottom: 0.5rem; }
    
    .post-card {
      background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-xl);
      padding: 1.25rem; margin-bottom: 1rem; transition: 0.2s; position: relative;
    }
    .post-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
    
    .post-header { display: flex; justify-content: space-between; margin-bottom: 0.75rem; }
    .post-meta { display: flex; align-items: center; gap: 0.75rem; }
    .post-actions { display: flex; gap: 1.5rem; margin-top: 1rem; padding-top: 0.75rem; border-top: 1px solid var(--border); }
    .action-btn { display: flex; align-items: center; gap: 0.4rem; color: var(--text-sec); font-size: 0.9rem; font-weight: 500; transition: 0.2s; }
    .action-btn:hover { color: var(--text-main); }
    .action-btn.liked { color: var(--error); }
    .action-btn.liked svg { fill: var(--error); stroke: var(--error); animation: heartPop 0.4s var(--ease-spring); }
    
    @keyframes heartPop { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }

    /* Composer */
    .composer { padding: 1rem; border-bottom: 1px solid var(--border); background: var(--bg-surface); margin-bottom: 1rem; border-radius: var(--radius-xl); display: flex; gap: 1rem; }
    .composer-input { flex: 1; background: transparent; border: none; resize: none; font-size: 1.1rem; color: var(--text-main); font-family: inherit; min-height: 24px; }
    .composer-input::placeholder { color: var(--text-mute); }

    /* Messages */
    .chat-layout { display: flex; height: calc(100vh - 60px); overflow: hidden; }
    .conv-list { width: 320px; border-right: 1px solid var(--border); overflow-y: auto; background: var(--bg-surface); }
    .conv-item { padding: 1rem; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; gap: 0.75rem; transition: 0.2s; }
    .conv-item:hover, .conv-item.active { background: var(--bg-hover); }
    .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-deep); }
    .chat-messages { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .message { max-width: 70%; padding: 0.75rem 1rem; border-radius: var(--radius-lg); font-size: 0.95rem; line-height: 1.4; position: relative; animation: slideUp 0.2s ease; }
    .message.mine { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 2px; }
    .message.theirs { align-self: flex-start; background: var(--bg-surface); border: 1px solid var(--border); border-bottom-left-radius: 2px; }

    /* Lightbox */
    #lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; display: none;
      align-items: center; justify-content: center; backdrop-filter: blur(10px);
    }
    #lightbox.active { display: flex; animation: fadeIn 0.2s; }
    #lightbox img { max-width: 90%; max-height: 90vh; border-radius: var(--radius-sm); box-shadow: 0 0 50px rgba(0,0,0,0.5); }

    /* Mobile */
    @media (max-width: 1024px) { aside.right-panel { display: none; } .main-content { border: none; } }
    @media (max-width: 768px) {
      aside.sidebar { display: none; }
      main.main-content { margin-left: 0; padding-bottom: 80px; }
      .mobile-nav { 
        position: fixed; bottom: 0; left: 0; right: 0; height: 60px; 
        background: var(--bg-glass-heavy); border-top: 1px solid var(--border);
        display: flex; justify-content: space-around; align-items: center; z-index: 100;
        backdrop-filter: blur(20px);
      }
      .conv-list { width: 80px; }
      .conv-info { display: none; }
    }
    @media (min-width: 769px) { .mobile-nav { display: none; } }

    /* Toast & Modal */
    .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
    .toast { background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-main); padding: 0.75rem 1.25rem; border-radius: var(--radius-md); box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 0.75rem; font-size: 0.9rem; pointer-events: auto; animation: slideInRight 0.3s var(--ease-spring); }
    @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 2000; display: flex; align-items: center; justify-content: center; animation: fadeIn 0.2s; }
    .modal-content { background: var(--bg-surface); width: 90%; max-width: 500px; border-radius: var(--radius-xl); border: 1px solid var(--border); box-shadow: var(--shadow-lg); overflow: hidden; animation: modalPop 0.3s var(--ease-spring); }
    @keyframes modalPop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    /* Particle Effect */
    .particle { position: absolute; pointer-events: none; animation: floatUp 1s ease-out forwards; color: var(--error); }
    @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-40px) scale(0); opacity: 0; } }

  </style>
</head>
<body>

  <!-- LIGHTBOX -->
  <div id="lightbox" onclick="UI.closeLightbox()">
    <img id="lightbox-img" src="" alt="Full view">
  </div>

  <!-- TOASTS -->
  <div class="toast-container" id="toast-container"></div>

  <!-- MODAL CONTAINER -->
  <div id="modal-root"></div>

  <!-- AUTH VIEW -->
  <section id="view-auth" class="view-section active">
    <div class="auth-container">
      <div class="auth-card">
        <div class="logo flex-center" style="justify-content: flex-start; margin-bottom: 2rem;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/></svg>
          <span class="text-gradient">PULSE</span>
        </div>
        
        <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem; background: var(--bg-deep); padding: 4px; border-radius: var(--radius-full);">
          <button id="tab-login" class="btn" style="flex:1; background: var(--bg-surface); color: var(--text-main); box-shadow: var(--shadow-sm);" onclick="AuthUI.switch('login')">Sign In</button>
          <button id="tab-register" class="btn" style="flex:1; color: var(--text-sec);" onclick="AuthUI.switch('register')">Join</button>
        </div>

        <form id="auth-form" onsubmit="AuthUI.submit(event)">
          <div id="login-fields">
            <div style="margin-bottom: 1rem;">
              <label style="display:block; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--text-sec); font-weight: 600;">Email</label>
              <input type="text" id="auth-email" class="input-field" placeholder="alex@pulse.app">
            </div>
            <div style="margin-bottom: 1.5rem;">
              <label style="display:block; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--text-sec); font-weight: 600;">Password</label>
              <input type="password" id="auth-pass" class="input-field" placeholder="••••••••">
            </div>
          </div>
          
          <div id="register-fields" class="hidden">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
              <div>
                <label style="display:block; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--text-sec); font-weight: 600;">Name</label>
                <input type="text" id="reg-name" class="input-field" placeholder="Alex Doe">
              </div>
              <div>
                <label style="display:block; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--text-sec); font-weight: 600;">Username</label>
                <input type="text" id="reg-user" class="input-field" placeholder="@alex">
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%;">Enter PULSE</button>
          
          <div style="margin-top: 1.5rem; text-align: center; font-size: 0.8rem; color: var(--text-mute);">
            Demo Creds: <span style="color: var(--text-sec);">alex@pulse.app</span> / <span style="color: var(--text-sec);">password</span>
          </div>
        </form>
      </div>
    </div>
  </section>

  <!-- MAIN APP STRUCTURE (Hidden until login) -->
  <div id="app-shell" class="hidden">
    
    <!-- DESKTOP SIDEBAR -->
    <aside class="sidebar">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/></svg>
        <span class="text-gradient">PULSE</span>
      </div>
      
      <nav style="flex: 1;">
        <a onclick="Router.go('feed')" class="nav-item active" id="nav-feed">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          Home
        </a>
        <a onclick="Router.go('explore')" class="nav-item" id="nav-explore">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
          Explore
        </a>
        <a onclick="Router.go('notifications')" class="nav-item" id="nav-notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 01-3.46 0"></path></svg>
          Notifications <span id="badge-notif" class="hidden" style="margin-left:auto; background:var(--error); width:8px; height:8px; border-radius:50%;"></span>
        </a>
        <a onclick="Router.go('messages')" class="nav-item" id="nav-messages">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"></path></svg>
          Messages <span id="badge-msg" class="hidden" style="margin-left:auto; background:var(--error); width:8px; height:8px; border-radius:50%;"></span>
        </a>
        <a onclick="Router.go('profile')" class="nav-item" id="nav-profile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          Profile
        </a>
      </nav>

      <button onclick="UI.openComposer()" class="btn btn-primary" style="width: 100%; border-radius: var(--radius-xl); margin-bottom: 1.5rem; padding: 0.9rem;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Post
      </button>

      <div class="flex-center" style="justify-content: flex-start; gap: 0.75rem; padding: 0.75rem; border-radius: var(--radius-xl); cursor: pointer; transition: 0.2s;" onclick="Router.go('profile')" id="current-user-mini">
        <!-- Injected by JS -->
      </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="main-content">
      
      <!-- FEED VIEW -->
      <div id="view-feed" class="page-container view-section">
        <header class="feed-header">
          <h2 style="font-size: 1.25rem;">Home</h2>
          <button class="btn-icon" title="Settings" onclick="Router.go('settings')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"></path></svg>

                <input type="file" id="quick-file" accept="image/*" hidden multiple>

        <div id="composer-previews" style="display:flex; gap:0.5rem; padding: 0 1rem 1rem 4rem;"></div>

        <!-- Feed Stream -->
        <div id="feed-stream" style="padding-bottom: 2rem;">
          <!-- Posts -->
        </div>
        
        <div id="feed-loader" class="flex-center hidden" style="padding: 2rem;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" class="spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
        </div>
      </div>

      <!-- EXPLORE VIEW -->
      <div id="view-explore" class="page-container view-section hidden">
         <header class="feed-header">
            <h2>Explore</h2>
            <div style="position:relative; width: 200px;">
               <input type="text" id="search-input" placeholder="Search..." class="input-field" style="padding-left: 2.2rem; border-radius: var(--radius-full); background: var(--bg-deep);">
               <svg width="16" height="16" style="position:absolute; left: 0.8rem; top: 0.85rem; color: var(--text-mute);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
         </header>
         <div style="padding: 1.5rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem;" id="explore-grid">
            <!-- Grid -->
         </div>
      </div>

      <!-- MESSAGES VIEW -->
      <div id="view-messages" class="page-container view-section hidden" style="max-width: 100%;">
         <div class="chat-layout">
            <div class="conv-list" id="conv-list"></div>
            <div class="chat-area">
               <div id="chat-placeholder" class="flex-center" style="height: 100%; color: var(--text-mute); flex-direction: column; gap: 1rem;">
                  <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"></path></svg>
                  <p>Select a conversation</p>
               </div>
               <div id="active-chat" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
                  <header class="feed-header" style="padding: 0.75rem 1.5rem;">
                     <div style="display: flex; align-items: center; gap: 0.75rem;">
                        <button class="btn-icon" onclick="Messages.closeChat()" style="margin-right: 0.5rem; width: 32px; height: 32px;">&larr;</button>
                        <div id="chat-header-user"></div>
                     </div>
                  </header>
                  <div class="chat-messages" id="chat-bubbles"></div>
                  <div style="padding: 1rem; border-top: 1px solid var(--border); background: var(--bg-surface); display: flex; gap: 0.75rem;">
                     <input type="text" id="chat-input" class="input-field" style="border-radius: var(--radius-full);" placeholder="Type a message...">
                     <button class="btn btn-primary" style="width: 44px; height: 44px; border-radius: 50%; padding: 0;" onclick="Messages.send()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                     </button>
                  </div>
               </div>

         </div>

      <!-- PROFILE VIEW -->
      <div id="view-profile" class="page-container view-section hidden">
         <div class="profile-header" style="height: 200px; background: var(--accent-gradient); position: relative;">
            <div style="position: absolute; bottom: -50px; left: 1.5rem; display: flex; align-items: flex-end; justify-content: space-between; width: calc(100% - 3rem);">
               <div style="width: 100px; height: 100px; border-radius: 50%; border: 4px solid var(--bg-deep); overflow: hidden; background: var(--bg-surface);" id="profile-banner-img"></div>
               <div style="margin-bottom: 1rem; display: flex; gap: 0.5rem;">
                  <button class="btn btn-outline" id="profile-action-btn">Edit Profile</button>
               </div>
            </div>
         </div>
         <div style="padding: 4rem 1.5rem 1.5rem;">
            <h1 id="p-name" style="font-size: 1.5rem; margin-bottom: 0.25rem;">Name</h1>
            <div id="p-handle" style="color: var(--text-sec); font-size: 0.95rem; margin-bottom: 1rem;">@handle</div>
            <p id="p-bio" style="margin-bottom: 1rem;">Bio text</p>
            <div style="display: flex; gap: 2rem; font-size: 0.9rem; margin-bottom: 2rem; color: var(--text-sec);">
               <span><strong style="color: var(--text-main);">0</strong> Followers</span>
               <span><strong style="color: var(--text-main);">0</strong> Following</span>
            </div>
            
            <div style="border-bottom: 1px solid var(--border); display: flex; gap: 2rem; margin-bottom: 1rem;">
               <button class="btn" style="color: var(--accent); border-bottom: 2px solid var(--accent); border-radius: 0;">Posts</button>
               <button class="btn" style="color: var(--text-sec);">Media</button>

            <div id="profile-posts"></div>
         </div>

      <!-- NOTIFICATIONS VIEW -->
      <div id="view-notifications" class="page-container view-section hidden">
         <header class="feed-header"><h2>Notifications</h2></header>
         <div id="notif-list"></div>

      <!-- SETTINGS VIEW -->
      <div id="view-settings" class="page-container view-section hidden">
         <header class="feed-header"><h2>Settings</h2></header>
         <div style="padding: 1.5rem;">
            <div class="glass-panel" style="padding: 1.5rem; margin-bottom: 1rem;">
               <h3 style="margin-bottom: 1rem;">Appearance</h3>
               <div class="flex-center" style="justify-content: space-between;">
                  <span>Dark Mode</span>
                  <button class="btn-icon" onclick="App.toggleTheme()">Switch</button>
               </div>
            </div>
            <button class="btn btn-danger" style="width: 100%; background: rgba(239, 68, 68, 0.1); color: var(--error);" onclick="Auth.logout()">Log Out</button>
         </div>
      </div>

    </main>

    <!-- RIGHT PANEL -->
    <aside class="right-panel" id="right-panel">
       <div style="margin-bottom: 2rem;">
          <h3 style="font-size: 0.85rem; text-transform: uppercase; color: var(--text-mute); letter-spacing: 1px; margin-bottom: 1rem;">Trending</h3>
          <div id="trending-list"></div>
       </div>
       
       <div>
          <h3 style="font-size: 0.85rem; text-transform: uppercase; color: var(--text-mute); letter-spacing: 1px; margin-bottom: 1rem;">Who to follow</h3>
          <div id="suggested-list"></div>
       </div>
    </aside>

    <!-- MOBILE NAV -->
    <nav class="mobile-nav">
       <button class="btn-icon" onclick="Router.go('feed')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg></button>
       <button class="btn-icon" onclick="Router.go('explore')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg></button>
       <button class="btn-icon" style="background: var(--accent); color: white; transform: translateY(-10px); box-shadow: 0 4px 10px rgba(139,92,246,0.4);" onclick="UI.openComposer()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
       <button class="btn-icon" onclick="Router.go('messages')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"></path></svg></button>
       <button class="btn-icon" onclick="Router.go('profile')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></button>
    </nav>

  </div>

  <script>
    /* ============================================================
       GODMODE ENGINE
       ============================================================ */
    
    // --- 1. CORE UTILS ---
    const $ = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);
    
    const Utils = {
      id: () => Math.random().toString(36).substr(2, 9),
      time: (d) => {
        const date = new Date(d), now = new Date(), diff = (now - date) / 1000;
        if (diff < 60) return 'now';
        if (diff < 3600) return `${Math.floor(diff / 60)}m`;
        if (diff < 86400) return `${Math.floor(diff / 3600)}h`;
        return date.toLocaleDateString();
      },
      formatNum: n => n > 999 ? (n/1000).toFixed(1) + 'k' : n,
      hash: str => {
        let hash = 0;
        for (let i = 0; i < str.length; i++) hash = ((hash << 5) - hash) + str.charCodeAt(i);
        return Math.abs(hash).toString(16);
      },
      avatar: (name, color) => {
        const initials = name.split(' ').map(n => n[0]).join('').substr(0,2).toUpperCase();
        return `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:${color};color:white;font-weight:700;font-size:0.9rem;">${initials}</div>`;
      },
      toast: (msg, type='info') => {
        const el = document.createElement('div');
        el.className = 'toast';
        el.innerHTML = `<span>${type === 'success' ? '✓' : 'ℹ'}</span> ${msg}`;
        $('#toast-container').appendChild(el);
        setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateY(10px)'; setTimeout(() => el.remove(), 300); }, 3000);
      }
    };

    // --- 2. DATABASE (LocalStorage + Seed) ---
    const DB = {
      init: () => {
        if(!localStorage.getItem('p_users')) {
          const seedUsers = [
            { id: 'u1', name: 'Alex Volkov', handle: 'alex', email: 'alex@pulse.app', pass: '5f4dcc3b5aa765d61d8327deb882cf99', bio: 'Building the future of UI/UX. 🚀', color: '#8b5cf6', following: ['u2'], followers: [] },
            { id: 'u2', name: 'Sarah Chen', handle: 'sarah', email: 'sarah@pulse.app', pass: '5f4dcc3b5aa765d61d8327deb882cf99', bio: 'Digital artist & photographer.', color: '#ec4899', following: [], followers: ['u1'] },
            { id: 'u3', name: 'Dev House', handle: 'devhouse', email: 'dev@pulse.app', pass: '5f4dcc3b5aa765d61d8327deb882cf99', bio: 'Tech news and updates.', color: '#3b82f6', following: [], followers: [] }
          ];
          const seedPosts = [
            { id: 'p1', uid: 'u1', text: 'Just launched the new PULSE interface. The glassmorphism effect is subtle but powerful! #design #ui', img: 'https://picsum.photos/seed/pulse1/600/350', likes: ['u2'], date: new Date().toISOString() },
            { id: 'p2', uid: 'u2', text: 'Golden hour in Tokyo. 🌅', img: 'https://picsum.photos/seed/tokyo/600/400', likes: ['u1'], date: new Date(Date.now() - 3600000).toISOString() },
            { id: 'p3', uid: 'u3', text: 'WebAssembly is changing the game for browser performance.', img: null, likes: [], date: new Date(Date.now() - 7200000).toISOString() }
          ];
          localStorage.setItem('p_users', JSON.stringify(seedUsers));
          localStorage.setItem('p_posts', JSON.stringify(seedPosts));
          localStorage.setItem('p_convos', JSON.stringify([]));
        }
      },
      get: (key) => JSON.parse(localStorage.getItem(key) || '[]'),
      set: (key, val) => localStorage.setItem(key, JSON.stringify(val)),
      user: {
        get: () => JSON.parse(localStorage.getItem('p_session')),
        login: (u) => localStorage.setItem('p_session', JSON.stringify(u)),
        logout: () => localStorage.removeItem('p_session')
      }
    };

    // --- 3. UI CONTROLLER ---
    const UI = {
      currentUser: null,
      
      init: () => {
        const u = DB.user.get();
        if(u) {
          UI.currentUser = u;
          $('#app-shell').classList.remove('hidden');
          $('#view-auth').classList.remove('active');
          Router.go('feed');
          UI.renderUserMini();
        } else {
          $('#view-auth').classList.add('active');
          $('#app-shell').classList.add('hidden');
        }
      },

      renderUserMini: () => {
        if(!UI.currentUser) return;
        $('#current-user-mini').innerHTML = `
          <div style="width:36px;height:36px;border-radius:50%;overflow:hidden;">${Utils.avatar(UI.currentUser.name, UI.currentUser.color)}</div>
          <div style="font-size:0.9rem;font-weight:600;">${UI.currentUser.name}</div>
        `;
      },

      createPostHTML: (p, isFeed = true) => {
        const author = DB.get('p_users').find(u => u.id === p.uid);
        const isLiked = p.likes.includes(UI.currentUser.id);
        const mediaHTML = p.img ? `<div style="margin-top:0.75rem;border-radius:var(--radius-md);overflow:hidden;cursor:pointer;" onclick="UI.openLightbox('${p.img}')"><img src="${p.img}" style="width:100%;height:auto;display:block;"></div>` : '';
        
        return `
        <article class="post-card fade-enter" style="animation-delay: 0.05s">
          <div class="post-header">
            <div class="post-meta" onclick="Router.go('profile', '${author.handle}')" style="cursor:pointer">
              <div style="width:42px;height:42px;border-radius:50%;overflow:hidden;border:1px solid var(--border);">${Utils.avatar(author.name, author.color)}</div>
              <div>
                <div style="font-weight:700;font-size:0.95rem;color:var(--text-main);">${author.name}</div>
                <div style="font-size:0.8rem;color:var(--text-sec);">@${author.handle} • ${Utils.time(p.date)}</div>
              </div>
            </div>
            ${isFeed ? `<button class="btn-icon" style="width:28px;height:28px;">•••</button>` : ''}
          </div>
          <div style="margin-top: 0.5rem; font-size: 0.95rem; line-height: 1.5; color: var(--text-main); white-space: pre-wrap;">${p.text}</div>
          ${mediaHTML}
          <div class="post-actions">
            <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="Effects.toggleLike(this, '${p.id}')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="${isLiked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"></path></svg>
              ${p.likes.length}
            </button>
            <button class="action-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"></path></svg>
              Comment
            </button>
            <button class="action-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
              Share
            </button>
          </div>
        </article>`;
      },

      openLightbox: (src) => {
        const lb = $('#lightbox');
        $('#lightbox-img').src = src;
        lb.classList.add('active');
      },
      closeLightbox: () => {
        $('#lightbox').classList.remove('active');
      },

      openComposer: () => {
        const html = `
          <div style="padding: 1.5rem;">
            <h3 style="margin-bottom:1rem;">New Post</h3>
            <textarea id="modal-composer" class="input-field" rows="4" style="margin-bottom:1rem; resize:none;" placeholder="What's on your mind?"></textarea>
            <div style="display:flex; justify-content:space-between; align-items:center;">
               <label class="btn btn-ghost btn-sm"><input type="file" hidden> Add Image</label>
               <button class="btn btn-primary" onclick="App.submitModalPost()">Post</button>
            </div>
          </div>
        `;
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.innerHTML = `<div class="modal-content">${html}</div>`;
        modal.onclick = (e) => { if(e.target === modal) modal.remove(); };
        $('#modal-root').appendChild(modal);
      },
      
      updateBadges: () => {
         // Placeholder logic for badges
         const notifBadge = $('#badge-notif');
         if(notifBadge) notifBadge.style.display = Math.random() > 0.5 ? 'block' : 'none';
      }
    };

    // --- 4. EFFECTS ENGINE ---
    const Effects = {
      toggleLike: (btn, pid) => {
        const posts = DB.get('p_posts');
        const post = posts.find(p => p.id === pid);
        const uid = UI.currentUser.id;
        
        if (post.likes.includes(uid)) {
          post.likes = post.likes.filter(id => id !== uid);
          btn.classList.remove('liked');
          btn.querySelector('svg').setAttribute('fill', 'none');
        } else {
          post.likes.push(uid);
          btn.classList.add('liked');
          btn.querySelector('svg').setAttribute('fill', 'currentColor');
          Effects.spawnParticles(btn);
        }
        
        DB.set('p_posts', posts);
        btn.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="${post.likes.includes(uid) ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"></path></svg>
          ${post.likes.length}
        `;
      },
      spawnParticles: (element) => {
        const rect = element.getBoundingClientRect();
        for(let i=0; i<5; i++) {
          const p = document.createElement('div');
          p.className = 'particle';
          p.innerHTML = '♥';
          p.style.left = (rect.left + rect.width/2 + (Math.random()*20 - 10)) + 'px';
          p.style.top = (rect.top) + 'px';
          p.style.fontSize = (Math.random() * 10 + 10) + 'px';
          document.body.appendChild(p);
          setTimeout(() => p.remove(), 1000);
        }
      }
    };

    // --- 5. ROUTER & VIEWS ---
    const Router = {
      go: (viewId, param = null) => {
        // Hide all views
        $$('.view-section').forEach(el => {
          el.classList.remove('active');
          el.classList.add('hidden');
        });
        
        // Show target
        const target = $(`#view-${viewId}`);
        target.classList.remove('hidden');
        setTimeout(() => target.classList.add('active'), 10);
        
        // Update Sidebar
        $$('.nav-item').forEach(el => el.classList.remove('active'));
        const navItem = $(`#nav-${viewId}`);
        if(navItem) navItem.classList.add('active');

        // Logic
        if (viewId === 'feed') App.renderFeed();
        if (viewId === 'explore') App.renderExplore();
        if (viewId === 'messages') Messages.renderList();
        if (viewId === 'profile') App.renderProfile(param || UI.currentUser.handle);
        if (viewId === 'notifications') App.renderNotifs();
        
        window.scrollTo(0,0);
      }
    };

    const App = {
      renderFeed: () => {
        const posts = DB.get('p_posts');
        const users = DB.get('p_users');
        const stream = $('#feed-stream');
        stream.innerHTML = posts.map(p => UI.createPostHTML(p)).join('');
        
        // Stories
        const stories = $('#stories-tray');
        stories.innerHTML = `
          <div class="story-item flex-center" style="flex-direction:column; gap:4px; min-width:64px;">
             <div class="story-ring" style="background:var(--border); padding:2px;"><div style="width:56px;height:56px;border-radius:50%;background:var(--bg-deep);display:flex;align-items:center;justify-content:center;color:var(--accent);">+</div></div>
             <span style="font-size:0.75rem;color:var(--text-sec);">Add</span>
          </div>
          ${users.map(u => `
            <div class="story-item flex-center" style="flex-direction:column; gap:4px; min-width:64px;">
               <div class="story-ring ${Math.random()>0.5?'has-story':''}" style="padding:2px;"><div style="width:56px;height:56px;border-radius:50%;overflow:hidden;">${Utils.avatar(u.name, u.color)}</div></div>
               <span style="font-size:0.75rem;color:var(--text-sec);">${u.name.split(' ')[0]}</span>
            </div>
          `).join('')}
        `;
        
        // Right Panel
        $('#trending-list').innerHTML = `
          <div style="padding:0.5rem 0;"><div style="font-size:0.8rem;color:var(--text-mute);">Technology · Trending</div><div style="font-weight:600;">#AI</div><div style="font-size:0.8rem;color:var(--text-sec);">54.2K posts</div></div>
          <div style="padding:0.5rem 0;"><div style="font-size:0.8rem;color:var(--text-mute);">Design · Trending</div><div style="font-weight:600;">#Glassmorphism</div><div style="font-size:0.8rem;color:var(--text-sec);">12K posts</div></div>
        `;
        $('#suggested-list').innerHTML = users.filter(u => u.id !== UI.currentUser.id).map(u => `
          <div class="flex-center" style="justify-content:space-between; margin-bottom:1rem;">
             <div class="flex-center" style="justify-content:flex-start; gap:0.75rem;">
                <div style="width:36px;height:36px;border-radius:50%;overflow:hidden;">${Utils.avatar(u.name, u.color)}</div>
                <div style="font-size:0.9rem; font-weight:600;">${u.name}</div>
             </div>
             <button class="btn btn-sm btn-primary" style="padding:0.4rem 0.8rem; font-size:0.8rem;">Follow</button>
          </div>
        `).join('');
      },

      submitModalPost: () => {
        const txt = $('#modal-composer').value;
        if(!txt) return;
        const posts = DB.get('p_posts');
        posts.unshift({ id: Utils.id(), uid: UI.currentUser.id, text: txt, img: null, likes: [], date: new Date().toISOString() });
        DB.set('p_posts', posts);
        $('#modal-root').innerHTML = '';
        Utils.toast('Posted successfully', 'success');
        if(Router.current === 'feed') App.renderFeed();
      },
      
      toggleTheme: () => {
         const html = document.documentElement;
         const current = html.getAttribute('data-theme');
         html.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
      },
      
      renderExplore: () => {
         const posts = DB.get('p_posts');
         $('#explore-grid').innerHTML = posts.map(p => `
            <div style="aspect-ratio:1; background:var(--bg-surface); border-radius:var(--radius-md); overflow:hidden; position: relative; cursor: pointer;" onclick="Router.go('feed')">
               ${p.img ? `<img src="${p.img}" style="width:100%;height:100%;object-fit:cover;">` : `<div style="padding:1rem; font-size:0.9rem;">${p.text}</div>`}
            </div>
         `).join('');
      },

      renderProfile: (handle) => {
         const user = DB.get('p_users').find(u => u.handle === handle) || UI.currentUser;
         const posts = DB.get('p_posts').filter(p => p.uid === user.id);
         
         $('#p-name').textContent = user.name;
         $('#p-handle').textContent = '@' + user.handle;
         $('#p-bio').textContent = user.bio;
         $('#profile-banner-img').innerHTML = Utils.avatar(user.name, user.color);
         
         $('#profile-posts').innerHTML = posts.length ? posts.map(p => UI.createPostHTML(p, false)).join('') : '<div style="padding:2rem;text-align:center;color:var(--text-sec);">No posts yet.</div>';
      },
      
      renderNotifs: () => {
         $('#notif-list').innerHTML = `
            <div style="padding:1rem; border-bottom:1px solid var(--border); display:flex; gap:1rem; align-items:center;">
               <div style="width:40px;height:40px;border-radius:50%;overflow:hidden;">${Utils.avatar('Sarah Chen', '#ec4899')}</div>
               <div><strong>Sarah Chen</strong> liked your post. <br><span style="font-size:0.8rem;color:var(--text-mute);">2m ago</span></div>
            </div>
         `;
      }
    };

    const Messages = {
      renderList: () => {
        const users = DB.get('p_users').filter(u => u.id !== UI.currentUser.id);
        $('#conv-list').innerHTML = users.map(u => `
          <div class="conv-item" onclick="Messages.openChat('${u.id}')">
            <div style="width:48px;height:48px;border-radius:50%;overflow:hidden;">${Utils.avatar(u.name, u.color)}</div>
            <div class="conv-info">
               <div style="font-weight:600;">${u.name}</div>
               <div style="font-size:0.85rem;color:var(--text-sec);">Click to start chatting</div>
            </div>
          </div>
        `).join('');
      },
      openChat: (uid) => {
        const user = DB.get('p_users').find(u => u.id === uid);
        $('#chat-placeholder').classList.add('hidden');
        $('#active-chat').classList.remove('hidden');
        $('#active-chat').style.display = 'flex';
        
        $('#chat-header-user').innerHTML = `
           <div style="width:32px;height:32px;border-radius:50%;overflow:hidden;">${Utils.avatar(user.name, user.color)}</div>
           <span style="font-weight:600;">${user.name}</span>
        `;
        
        $('#chat-bubbles').innerHTML = `
           <div class="message theirs">Hey! Did you see the new update?</div>
           <div class="message mine">Yeah, the new glassmorphism is slick 🔥</div>
        `;
      },
      closeChat: () => {
        $('#chat-placeholder').classList.remove('hidden');
        $('#active-chat').classList.add('hidden');
        $('#active-chat').style.display = 'none';
      },
      send: () => {
        const input = $('#chat-input');
        const txt = input.value.trim();
        if(!txt) return;
        const bubble = document.createElement('div');
        bubble.className = 'message mine';
        bubble.textContent = txt;
        $('#chat-bubbles').appendChild(bubble);
        input.value = '';
        $('#chat-bubbles').scrollTop = $('#chat-bubbles').scrollHeight;
      }
    };

    const AuthUI = {
      mode: 'login',
      switch: (m) => {
        AuthUI.mode = m;
        $('#tab-login').style.background = m === 'login' ? 'var(--bg-surface)' : 'transparent';
        $('#tab-login').style.color = m === 'login' ? 'var(--text-main)' : 'var(--text-sec)';
        $('#tab-register').style.background = m === 'register' ? 'var(--bg-surface)' : 'transparent';
        $('#tab-register').style.color = m === 'register' ? 'var(--text-main)' : 'var(--text-sec)';
        
        if(m === 'login') {
          $('#login-fields').classList.remove('hidden');
          $('#register-fields').classList.add('hidden');
        } else {
          $('#login-fields').classList.add('hidden');
          $('#register-fields').classList.remove('hidden');
        }
      },
      submit: (e) => {
        e.preventDefault();
        const email = $('#auth-email').value;
        const pass = $('#auth-pass').value; // In real app, hash this
        
        if (AuthUI.mode === 'login') {
          const users = DB.get('p_users');
          const user = users.find(u => u.email === email && u.pass === Utils.hash(pass));
          if(user) {
            DB.user.login(user);
            UI.init();
          } else {
            Utils.toast('Invalid credentials', 'error');
          }
        } else {
          const name = $('#reg-name').value;
          const handle = $('#reg-user').value.replace('@','');
          const users = DB.get('p_users');
          if(users.find(u => u.handle === handle)) return Utils.toast('Username taken', 'error');
          
          const newUser = { id: Utils.id(), name, handle, email, pass: Utils.hash(pass), bio: '', color: '#'+Math.floor(Math.random()*16777215).toString(16), following: [], followers: [] };
          users.push(newUser);
          DB.set('p_users', users);
          DB.user.login(newUser);
          UI.init();
        }
      }
    };
    
    const Auth = {
       logout: () => {
          DB.user.logout();
          location.reload();
       }
    };

    // --- BOOTSTRAP ---
    window.onload = () => {
      DB.init();
      UI.init();
      
      // Quick Composer Logic
      const qc = $('#quick-composer');
      const qb = $('#quick-post-btn');
      qc.addEventListener('input', () => {
         qc.style.height = 'auto';
         qc.style.height = qc.scrollHeight + 'px';
         qb.disabled = qc.value.trim() === '';
      });
      
      qb.onclick = () => {
         if(!qc.value.trim()) return;
         const posts = DB.get('p_posts');
         posts.unshift({ id: Utils.id(), uid: UI.currentUser.id, text: qc.value, img: null, likes: [], date: new Date().toISOString() });
         DB.set('p_posts', posts);
         qc.value = '';
         qc.style.height = 'auto';
         qb.disabled = true;
         App.renderFeed();
         Utils.toast('Posted!', 'success');
      };
    };

  </script>
</body>
</html>
