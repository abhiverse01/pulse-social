<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PULSE — Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/feed.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/notifications.css">
</head>
<body>
  <div id="toast-container"></div>

  <div class="app-shell">
    <div id="sidebar" class="sidebar"></div>

    <div class="main-content">
      <div class="three-col">
        <div class="three-col-main">
          <div class="content-header">
            <button class="btn-icon" onclick="history.back()" title="Back">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <div>
              <h1 id="profile-header-name">Profile</h1>
              <div id="profile-header-count" style="font-size:0.78rem;color:var(--text-muted)"></div>
            </div>
          </div>

          <!-- Profile hero injected by profile.js -->
          <div id="profile-hero"></div>

          <!-- Tabs -->
          <div id="profile-tabs" class="profile-tabs"></div>

          <!-- Content (posts grid or list) -->
          <div id="profile-posts"></div>
        </div>

        <div id="right-panel" class="right-panel"></div>
      </div>
    </div>
  </div>

  <nav class="mobile-nav" id="mobile-nav"></nav>

  <script src="data/seed.js"></script>
  <script src="js/db.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/media.js"></script>
  <script src="js/app.js"></script>
  <script src="js/feed.js"></script>
  <script src="js/profile.js"></script>
  <script>
    const currentUser = App.init(true);
    if (currentUser) Profile.init(currentUser);
  </script>
</body>
</html>
