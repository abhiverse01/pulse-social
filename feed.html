<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PULSE — Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/feed.css">
  <link rel="stylesheet" href="css/notifications.css">
</head>
<body>
  <div id="toast-container"></div>
  <div class="app-shell">
    <div id="sidebar" class="sidebar"></div>
    <div class="main-content">
      <div class="three-col">
        <div class="three-col-main">
          <div class="content-header">
            <h1>Home</h1>
            <div class="content-header-actions">
              <button class="btn-icon" title="Refresh" onclick="Feed.loadFeed(false)">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
              </button>
            </div>
          </div>
          <!-- Stories -->
          <div class="stories-bar"><div id="stories-track"></div></div>
          <!-- Inline post composer -->
          <form id="post-composer" class="post-composer-inline">
            <div class="post-composer-row">
              <div id="composer-avatar-inline"></div>
              <textarea id="compose-text" placeholder="What's on your mind?" rows="1" maxlength="2000"></textarea>
            </div>
            <div id="compose-previews" class="media-preview"></div>
            <div class="post-composer-footer">
              <label class="composer-media-label" title="Add images">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                <input type="file" id="compose-file" accept="image/*" multiple style="display:none">
              </label>
              <span class="composer-char-count"><span id="compose-char">0</span>/2000</span>
              <button type="submit" class="btn btn-primary btn-sm" id="compose-submit" disabled>Post</button>
            </div>
          </form>
          <!-- Feed -->
          <div id="feed-posts" class="feed-list"></div>
          <div id="feed-end" class="feed-end" style="display:none">You're all caught up ✨</div>
          <div id="feed-loader" class="feed-loading" style="display:none"><div class="spinner"></div></div>
        </div>
        <div id="right-panel" class="right-panel"></div>
      </div>
    </div>
  </div>
  <nav class="mobile-nav" id="mobile-nav"></nav>
  <script src="data/seed.js"></script>
  <script src="js/db.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/media.js"></script>
  <script src="js/app.js"></script>
  <script src="js/feed.js"></script>
  <script>
    const currentUser = App.init(true);
    if (currentUser) Feed.init(currentUser);
  </script>
</body>
</html>
