<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PULSE — Notifications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/notifications.css">
</head>
<body>
  <div id="toast-container"></div>

  <div class="app-shell">
    <div id="sidebar" class="sidebar"></div>

    <div class="main-content">
      <div class="three-col">
        <div class="three-col-main">
          <div class="content-header">
            <h1>Notifications</h1>
            <div class="content-header-actions">
              <button class="notif-mark-all-btn" onclick="Notifications.markAllRead()">Mark all read</button>
            </div>
          </div>
          <div id="notif-list"></div>
        </div>
        <div id="right-panel" class="right-panel"></div>
      </div>
    </div>
  </div>

  <nav class="mobile-nav" id="mobile-nav"></nav>

  <script src="data/seed.js"></script>
  <script src="js/db.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/media.js"></script>
  <script src="js/app.js"></script>
  <script src="js/notifications.js"></script>
  <script>
    const currentUser = App.init(true);
    if (currentUser) Notifications.init(currentUser);
  </script>
</body>
</html>
