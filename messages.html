<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PULSE — Messages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/messages.css">
  <link rel="stylesheet" href="css/notifications.css">
  <style>
    .app-shell { height: 100vh; overflow: hidden; }
    .main-content { height: 100vh; overflow: hidden; }
  </style>
</head>
<body>
  <div id="toast-container"></div>
  <div class="app-shell">
    <div id="sidebar" class="sidebar"></div>
    <div class="main-content">
      <div class="messages-layout" id="messages-container">
        <!-- Conversation list panel -->
        <div class="conv-list-panel" id="conv-list-panel">
          <div class="conv-list-header">
            <h1>Messages</h1>
            <button class="btn-icon" id="new-dm-btn" title="New message" onclick="Messages.openNewDM()">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            </button>
          </div>
          <div id="conv-list" class="conv-list"></div>
        </div>
        <!-- Chat panel -->
        <div class="chat-panel" id="chat-area"></div>
      </div>
    </div>
  </div>
  <nav class="mobile-nav" id="mobile-nav"></nav>
  <script src="data/seed.js"></script>
  <script src="js/db.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/media.js"></script>
  <script src="js/app.js"></script>
  <script src="js/messages.js"></script>
  <script>
    const currentUser = App.init(true);
    if (currentUser) Messages.init(currentUser);
  </script>
</body>
</html>
